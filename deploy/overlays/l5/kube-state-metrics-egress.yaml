apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myai-kube-state-metrics-egress
  namespace: myai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: myai-kube-state-metrics
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: 192.168.122.55/32
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
