apiVersion: v1
kind: ServiceAccount
metadata:
  name: myai-kube-state-metrics
  namespace: myai
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: myai-kube-state-metrics
  namespace: myai
rules:
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myai-kube-state-metrics
  namespace: myai
subjects:
  - kind: ServiceAccount
    name: myai-kube-state-metrics
    namespace: myai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: myai-kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myai-kube-state-metrics
  namespace: myai
  labels:
    app.kubernetes.io/name: myai-kube-state-metrics
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myai-kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myai-kube-state-metrics
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: myai-kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.example.invalid/kube-state-metrics:v2.20.0
          imagePullPolicy: IfNotPresent
          args:
            - --resources=cronjobs,jobs
            - --namespaces=myai
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 150m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: myai-kube-state-metrics
  namespace: myai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: myai-kube-state-metrics
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
    - {name: telemetry, port: 8081, targetPort: telemetry}
