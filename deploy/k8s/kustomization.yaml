apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myai
resources:
  - base/agent-worker-deployment.yaml
  - base/l5-foundation.yaml
  - base/tempo.yaml
  - base/grafana.yaml
  - base/prometheus-console.yaml
  - base/l5-postgres.yaml
  - base/network-policies.yaml
  - base/model-egress-proxy.yaml
configMapGenerator:
  - name: myai-tempo
    files:
      - config.yaml=base/tempo-config.yaml
  - name: myai-prometheus-rules
    files:
      - alerts.yml=base/agent-alerts.yaml
  - name: myai-grafana-dashboard-provider
    files:
      - dashboards.yaml=base/grafana/dashboards.yaml
  - name: myai-grafana-dashboard-config
    files:
      - myai-runtime-overview.json=base/grafana/myai-runtime-overview.json
