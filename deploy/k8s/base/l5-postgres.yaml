apiVersion: v1
kind: Namespace
metadata:
  name: myai
  labels:
    app.kubernetes.io/part-of: myai-agent-runtime
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: myai-runtime
  namespace: myai
data:
  database-url: jdbc:postgresql://myai-postgres:5432/myai?sslmode=verify-full&sslrootcert=/var/run/secrets/database-ca/ca.crt
  database-username: myai
  application-name: myai-agent-runtime
  run-retention-period: PT0S
  model-base-url: https://api.deepseek.com
  model-proxy-url: http://myai-model-egress-proxy:3128
---
apiVersion: v1
kind: Service
metadata:
  name: myai-postgres
  namespace: myai
  labels:
    app.kubernetes.io/name: myai-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: myai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myai-postgres-data
  namespace: myai
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: myai-postgres
  namespace: myai
spec:
  serviceName: myai-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myai-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myai-postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-data-permissions
          image: postgres:18.0-alpine@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
          command: [sh, -ec, 'mkdir -p /var/lib/postgresql/data/pgdata /var/run/postgresql && chown -R 999:999 /var/lib/postgresql/data /var/run/postgresql']
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
        - name: prepare-tls-key
          image: postgres:18.0-alpine@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
          command: [sh, -ec, 'cp /tls-input/tls.crt /tls-ready/tls.crt && cp /tls-input/tls.key /tls-ready/tls.key && chown 999:999 /tls-ready/tls.key && chmod 0600 /tls-ready/tls.key && chmod 0644 /tls-ready/tls.crt']
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - {name: postgres-tls, mountPath: /tls-input, readOnly: true}
            - {name: postgres-tls-ready, mountPath: /tls-ready}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: postgres
          image: postgres:18.0-alpine@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
          imagePullPolicy: IfNotPresent
          # The permission initContainer prepares the dedicated PVC; the database process itself runs as UID 999.
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: myai
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: myai-runtime
                  key: database-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myai-database
                  key: database-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/run/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/var/run/postgresql/tls/tls.key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: postgres-tls-ready
              mountPath: /var/run/postgresql/tls
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: myai-postgres-data
        - name: socket
          emptyDir:
            sizeLimit: 64Mi
        - name: postgres-tls
          secret:
            secretName: myai-postgres-tls
            defaultMode: 0440
        - name: postgres-tls-ready
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
