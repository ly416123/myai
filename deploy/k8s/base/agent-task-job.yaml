apiVersion: batch/v1
kind: Job
metadata:
  generateName: myai-agent-task-
  labels:
    app.kubernetes.io/name: myai-agent
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myai-agent
        app.kubernetes.io/component: task
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: myai-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: registry.example.invalid/myai:REPLACE_WITH_VERSION
          imagePullPolicy: IfNotPresent
          env:
            - name: AGENT_EXECUTION_MODE
              value: once
            - name: AGENT_TASK
              valueFrom:
                secretKeyRef:
                  name: myai-agent-task
                  key: task
            - name: DEEPSEEK_KEY_FILE
              value: /var/run/secrets/myai/deepseek-api-key
            - name: DEEPSEEK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: myai-runtime
                  key: model-base-url
            - name: AGENT_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: myai-runtime
                  key: database-url
            - name: AGENT_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: myai-runtime
                  key: database-username
            - name: AGENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myai-database
                  key: database-password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: database-ca
              mountPath: /var/run/secrets/database-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: provider-key
              mountPath: /var/run/secrets/myai
              readOnly: true
      volumes:
        - name: database-ca
          secret:
            secretName: myai-postgres-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: provider-key
          secret:
            secretName: myai-provider
            defaultMode: 0440
