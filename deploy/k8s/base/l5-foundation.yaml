apiVersion: v1
kind: ConfigMap
metadata:
  name: myai-otel-collector
  namespace: myai
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
      resource/l5:
        attributes:
          - key: deployment.environment.name
            value: l5
            action: upsert
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      prometheus:
        endpoint: 0.0.0.0:9464
        namespace: myai
        send_timestamps: true
        metric_expiration: 5m
        resource_constant_labels:
          included:
            - service.instance.id
      debug:
        verbosity: basic
      otlphttp/tempo:
        endpoint: http://myai-tempo:4318
        timeout: 5s
        sending_queue:
          enabled: true
          storage: file_storage/tempo
          queue_size: 256
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 1h
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/tempo:
        directory: /var/lib/otelcol/tempo-queue
        create_directory: true
        fsync: true
    service:
      extensions: [health_check, file_storage/tempo]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/l5, batch]
          exporters: [otlphttp/tempo]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myai-otel-collector-queue
  namespace: myai
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myai-otel-collector
  namespace: myai
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myai-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myai-otel-collector
        app.kubernetes.io/component: telemetry
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.165.0@sha256:bda8c1d727effc2f937d2a3470ea3f9ee189b8dd96d2385a2475b0b6f16ec3f8
          imagePullPolicy: IfNotPresent
          args: [--config=/etc/otelcol-contrib/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 9464}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: queue, mountPath: /var/lib/otelcol}
      volumes:
        - name: config
          configMap:
            name: myai-otel-collector
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: queue
          persistentVolumeClaim:
            claimName: myai-otel-collector-queue
---
apiVersion: v1
kind: Service
metadata:
  name: myai-otel-collector
  namespace: myai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: myai-otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 9464, targetPort: prometheus}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: myai-prometheus
  namespace: myai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/rules/alerts.yml
    scrape_configs:
      - job_name: myai-otel-collector
        static_configs:
          - targets: [myai-otel-collector:9464]
            labels:
              environment: l5
      - job_name: myai-tempo
        static_configs:
          - targets: [myai-tempo:3200]
            labels:
              environment: l5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myai-prometheus-data
  namespace: myai
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myai-prometheus
  namespace: myai
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myai-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myai-prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.console.templates=/etc/prometheus/consoles
            - --web.console.libraries=/etc/prometheus/consoles
          ports:
            - {name: web, containerPort: 9090}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe:
            httpGet: {path: /-/ready, port: web}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: rules, mountPath: /etc/prometheus/rules, readOnly: true}
            - {name: consoles, mountPath: /etc/prometheus/consoles, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: myai-prometheus
        - name: rules
          configMap:
            name: myai-prometheus-rules
        - name: consoles
          configMap:
            name: myai-agent-overview
        - name: data
          persistentVolumeClaim:
            claimName: myai-prometheus-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: myai-prometheus
  namespace: myai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: myai-prometheus
  ports:
    - {name: web, port: 9090, targetPort: web}
