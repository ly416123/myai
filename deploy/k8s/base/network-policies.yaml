apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myai-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myai-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: myai-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: myai-agent
              app.kubernetes.io/component: worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: myai-agent
              app.kubernetes.io/component: task
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: myai-agent
              app.kubernetes.io/component: backup
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myai-collector-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: myai-otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: myai-agent
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: myai-prometheus
      ports:
        - protocol: TCP
          port: 9464
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myai-prometheus-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: myai-prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: myai-otel-collector
      ports:
        - protocol: TCP
          port: 9090
