groups:
  - name: myai-agent-runtime
    interval: 30s
    rules:
      - alert: MyAiCollectorTargetDown
        expr: up{job="myai-otel-collector"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: MyAI telemetry collector metrics endpoint is unavailable

      - alert: AgentKubeStateMetricsDown
        expr: up{job="myai-kube-state-metrics"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes backup status metrics endpoint is unavailable

      - alert: AgentBackupStale
        expr: absent(kube_cronjob_status_last_successful_time{namespace="myai",cronjob="myai-postgres-backup"}) or (time() - kube_cronjob_status_last_successful_time{namespace="myai",cronjob="myai-postgres-backup"} > 30 * 60 * 60)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: No successful PostgreSQL backup is visible within the freshness window
          description: Check the CronJob, backup Job status, local backup PVC, and kube-state-metrics availability.

      - alert: AgentWorkerQueueStalled
        expr: max(myai_agent_worker_queue_oldest_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent queue has waited over five minutes
          description: Check worker readiness, model availability, and database queue claims.

      - alert: AgentExpiredRunLeases
        expr: max(myai_agent_worker_lease_expired_leases) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: One or more Run leases have expired
          description: Check worker restarts and Run recovery; do not manually replay side-effecting tools.

      - alert: AgentRecentRunFailures
        expr: max(myai_agent_worker_run_failed_recent_runs) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: One or more Runs failed within the last five minutes
          description: Check the bounded Run failure categories and persisted Run records.

      - alert: AgentDatabasePoolNearCapacity
        expr: sum(myai_hikaricp_connections_active) / sum(myai_hikaricp_connections_max) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent database connection pool is near capacity
          description: Review worker concurrency and database pool sizing.
