services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myai
      POSTGRES_USER: ${AGENT_DB_USERNAME:-myai}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${AGENT_DB_PORT:-5432}:5432"
    volumes:
      - myai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  myai-postgres-data:
