# Unit tests for the same alert file mounted by the L5 Prometheus deployment.
rule_files:
  - agent-alerts.yaml

evaluation_interval: 30s

tests:
  - name: alert transitions after configured delays
    interval: 30s
    input_series:
      - series: 'up{job="myai-otel-collector"}'
        values: "0+0x20"
      - series: 'up{job="myai-tempo"}'
        values: "0+0x20"
      - series: myai_agent_worker_queue_depth_runs
        values: "0+0x20"
      - series: myai_agent_worker_queue_oldest_seconds
        values: "301+0x20"
      - series: myai_agent_worker_lease_expired_leases
        values: "1+0x20"
      - series: myai_agent_worker_run_failed_recent_runs
        values: "1+0x20"
      - series: myai_agent_worker_poll_failures_total
        values: "1+1x20"
      - series: myai_hikaricp_connections_active
        values: "10+0x20"
      - series: myai_hikaricp_connections_max
        values: "10+0x20"
    alert_rule_test:
      - eval_time: 30s
        alertname: MyAiCollectorTargetDown
        exp_alerts: []
      - eval_time: 30s
        alertname: MyAiTempoTargetDown
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentWorkerQueueStalled
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentExpiredRunLeases
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentRecentRunFailures
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentDatabasePoolNearCapacity
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentWorkerPollingFailures
        exp_alerts: []
      - eval_time: 2m
        alertname: MyAiCollectorTargetDown
        exp_alerts:
          - exp_labels:
              job: myai-otel-collector
              severity: warning
            exp_annotations:
              summary: MyAI telemetry collector metrics endpoint is unavailable
      - eval_time: 2m
        alertname: MyAiTempoTargetDown
        exp_alerts:
          - exp_labels:
              job: myai-tempo
              severity: warning
            exp_annotations:
              summary: MyAI Tempo trace query backend is unavailable
              description: Check the Tempo pod, service endpoint, and local trace storage.
      - eval_time: 2m
        alertname: AgentExpiredRunLeases
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: One or more Run leases have expired
              description: Check worker restarts and Run recovery; do not manually replay side-effecting tools.
      - eval_time: 2m
        alertname: AgentRecentRunFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: One or more Runs failed within the last five minutes
              description: Check the bounded Run failure categories and persisted Run records.
      - eval_time: 5m
        alertname: AgentWorkerQueueStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Agent queue has waited over five minutes
              description: Check worker readiness, model availability, and database queue claims.
      - eval_time: 5m
        alertname: AgentDatabasePoolNearCapacity
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Agent database connection pool is near capacity
              description: Review worker concurrency and database pool sizing.
      - eval_time: 2m
        alertname: AgentWorkerPollingFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Agent worker cannot poll its persistent queue
              description: Check PostgreSQL availability and worker readiness; repeated polling failures may delay queued Runs.

  - name: thresholds do not fire at boundary
    interval: 30s
    input_series:
      - series: 'up{job="myai-otel-collector"}'
        values: "1+0x20"
      - series: 'up{job="myai-tempo"}'
        values: "1+0x20"
      - series: myai_agent_worker_queue_depth_runs
        values: "0+0x20"
      - series: myai_agent_worker_queue_oldest_seconds
        values: "300+0x20"
      - series: myai_agent_worker_lease_expired_leases
        values: "0+0x20"
      - series: myai_agent_worker_run_failed_recent_runs
        values: "0+0x20"
      - series: myai_agent_worker_poll_failures_total
        values: "0+0x20"
      - series: myai_hikaricp_connections_active
        values: "9+0x20"
      - series: myai_hikaricp_connections_max
        values: "10+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: MyAiCollectorTargetDown
        exp_alerts: []
      - eval_time: 10m
        alertname: MyAiTempoTargetDown
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentWorkerQueueStalled
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentExpiredRunLeases
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentRecentRunFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentDatabasePoolNearCapacity
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentWorkerPollingFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentWorkerTelemetryMissing
        exp_alerts: []

  - name: missing worker telemetry is detected
    interval: 30s
    alert_rule_test:
      - eval_time: 3m
        alertname: AgentWorkerTelemetryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Agent worker queue telemetry is missing
              description: Check worker readiness and the OTLP metrics path through the collector.
