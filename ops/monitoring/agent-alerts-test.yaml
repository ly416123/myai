# Unit tests for the same alert file mounted by the L5 Prometheus deployment.
rule_files:
  - agent-alerts.yaml

evaluation_interval: 30s

tests:
  - name: alert state transitions
    interval: 30s
    input_series:
      - series: 'up{job="myai-otel-collector"}'
        values: "0+0x20"
      - series: 'up{job="myai-kube-state-metrics"}'
        values: "0+0x20"
      - series: myai_agent_worker_queue_oldest_seconds
        values: "301+0x20"
      - series: myai_agent_worker_lease_expired_leases
        values: "1+0x20"
      - series: myai_agent_worker_run_failed_recent_runs
        values: "1+0x20"
      - series: myai_hikaricp_connections_active
        values: "10+0x20"
      - series: myai_hikaricp_connections_max
        values: "10+0x20"
    alert_rule_test:
      - eval_time: 30s
        alertname: MyAiCollectorTargetDown
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentWorkerQueueStalled
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentExpiredRunLeases
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentRecentRunFailures
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentDatabasePoolNearCapacity
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentKubeStateMetricsDown
        exp_alerts: []
      - eval_time: 30s
        alertname: AgentBackupStale
        exp_alerts: []
      - eval_time: 5m
        alertname: AgentBackupStale
        exp_alerts:
          - exp_labels:
              namespace: myai
              cronjob: myai-postgres-backup
              severity: warning
            exp_annotations:
              summary: No successful PostgreSQL backup is visible within the freshness window
              description: Check the CronJob, backup Job status, local backup PVC, and kube-state-metrics availability.
      - eval_time: 2m
        alertname: MyAiCollectorTargetDown
        exp_alerts:
          - exp_labels:
              job: myai-otel-collector
              severity: warning
            exp_annotations:
              summary: MyAI telemetry collector metrics endpoint is unavailable
      - eval_time: 2m
        alertname: AgentKubeStateMetricsDown
        exp_alerts:
          - exp_labels:
              job: myai-kube-state-metrics
              severity: warning
            exp_annotations:
              summary: Kubernetes backup status metrics endpoint is unavailable
      - eval_time: 2m
        alertname: AgentExpiredRunLeases
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: One or more Run leases have expired
              description: Check worker restarts and Run recovery; do not manually replay side-effecting tools.
      - eval_time: 2m
        alertname: AgentRecentRunFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: One or more Runs failed within the last five minutes
              description: Check the bounded Run failure categories and persisted Run records.
      - eval_time: 5m
        alertname: AgentWorkerQueueStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Agent queue has waited over five minutes
              description: Check worker readiness, model availability, and database queue claims.
      - eval_time: 5m
        alertname: AgentDatabasePoolNearCapacity
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Agent database connection pool is near capacity
              description: Review worker concurrency and database pool sizing.

  - name: alert thresholds do not fire at boundary
    interval: 30s
    input_series:
      - series: 'up{job="myai-otel-collector"}'
        values: "1+0x20"
      - series: 'up{job="myai-kube-state-metrics"}'
        values: "1+0x20"
      - series: 'kube_cronjob_status_last_successful_time{namespace="myai",cronjob="myai-postgres-backup"}'
        values: "0+30x20"
      - series: myai_agent_worker_queue_oldest_seconds
        values: "300+0x20"
      - series: myai_agent_worker_lease_expired_leases
        values: "0+0x20"
      - series: myai_agent_worker_run_failed_recent_runs
        values: "0+0x20"
      - series: myai_hikaricp_connections_active
        values: "9+0x20"
      - series: myai_hikaricp_connections_max
        values: "10+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: MyAiCollectorTargetDown
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentWorkerQueueStalled
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentExpiredRunLeases
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentRecentRunFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentDatabasePoolNearCapacity
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentKubeStateMetricsDown
        exp_alerts: []
      - eval_time: 10m
        alertname: AgentBackupStale
        exp_alerts: []

  - name: old backup success timestamp fires stale alert
    interval: 5m
    input_series:
      - series: 'up{job="myai-kube-state-metrics"}'
        values: "1+0x362"
      - series: 'kube_cronjob_status_last_successful_time{namespace="myai",cronjob="myai-postgres-backup"}'
        values: "0+0x362"
    alert_rule_test:
      - eval_time: 30h
        alertname: AgentBackupStale
        exp_alerts: []
      - eval_time: 30h10m
        alertname: AgentBackupStale
        exp_alerts:
          - exp_labels:
              namespace: myai
              cronjob: myai-postgres-backup
              severity: warning
            exp_annotations:
              summary: No successful PostgreSQL backup is visible within the freshness window
              description: Check the CronJob, backup Job status, local backup PVC, and kube-state-metrics availability.
